name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # without it the live site looks for rooms on :8787 and never finds them
      - run: test -n "$VITE_ROOMS_URL" || { echo "Set the ROOMS_URL repo variable to the worker's wss:// address"; exit 1; }
        env:
          VITE_ROOMS_URL: ${{ vars.ROOMS_URL }}
      - run: npm run build
        env:
          # the deployed rooms worker, wss://... Set under the repo's Actions variables
          VITE_ROOMS_URL: ${{ vars.ROOMS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
